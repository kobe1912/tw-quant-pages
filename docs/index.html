<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>台股量化策略研究站</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#e5edf9;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:22px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid #263349;background:#101b2e}h1{font-size:23px;margin:4px 0}h2{font-size:19px}p{line-height:1.55}.muted,small{color:#9daec5}.wrap{max-width:1100px;margin:auto;padding:20px 16px 60px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button{border:1px solid #34445f;background:#142139;color:#dce8fa;border-radius:10px;padding:11px 16px;white-space:nowrap}.tabs button.active{background:#2262a6;border-color:#488fd4}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.panel,.stat{background:#132036;border:1px solid #263a55;border-radius:15px;padding:16px;margin-bottom:14px}.stat strong{font-size:23px;display:block;margin-top:7px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:12px;text-align:left;border-bottom:1px solid #30405a;font-size:14px}th{color:#a8bdd6}button{cursor:pointer}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:12px;background:#344157}.BUY_WATCH{color:#63d7a0}.EXIT_WATCH{color:#ff9a9a}.HOLD_WATCH{color:#c2cbd7}.good{color:#63d7a0}.bad{color:#ff9a9a}.detail{background:#101a2d;border-radius:10px;padding:12px;margin:10px 0}.notice{border-left:3px solid #d9a64a;padding:12px;background:#30281d;color:#f2d6a4}.hidden{display:none}ul{padding-left:22px}li{margin:5px 0}@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:19px}h1{font-size:20px}.wrap{padding:12px}.panel{padding:13px}}
</style></head><body><header><small>TW QUANT · END OF DAY RESEARCH</small><h1>台股量化策略研究站</h1><div class="muted" id="meta">正在讀取資料…</div></header><main class="wrap"><div class="notice">研究與模擬用途，非盤中即時報價或投資建議。資料與訊號日期請以畫面顯示為準。</div><nav class="tabs"><button class="active" data-tab="signals">每日訊號</button><button data-tab="portfolio">績效中心</button><button data-tab="weekly">每週回顧</button><button data-tab="method">策略說明</button></nav><section id="signals"></section><section id="portfolio" class="hidden"></section><section id="weekly" class="hidden"></section><section id="method" class="hidden"></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>n==null?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});const tone=n=>n>=0?'good':'bad';const act={BUY_WATCH:'買進觀察',HOLD_WATCH:'持有／等待',EXIT_WATCH:'賣出警示'};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['signals','portfolio','weekly','method'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
function card(s){return `<article class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${esc(s.name)} ${esc(s.symbol)}</b><div class="muted">${esc(s.date)} · 收盤 NT$${money(s.price)}</div></div><div style="text-align:right"><b style="font-size:24px">${s.score}<small>/100</small></b><div class="${s.action}">${act[s.action]}</div></div></div><div class="detail"><b>買進依據</b><ul>${(s.reasons.length?s.reasons:['目前未滿足主要買進加分條件']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><b>賣出／風險原因</b><ul>${(s.exit_reasons.length?s.exit_reasons:['尚未觸發趨勢出場警示；仍需遵守停損']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><small>參考停損 NT$${money(s.stop)} · 參考目標 NT$${money(s.target)} · MA20 ${money(s.ma20)} · RSI ${money(s.rsi)}</small></div></article>`}
async function boot(){try{const r=await fetch('./data/latest.json?v='+Date.now());if(!r.ok)throw Error('資料尚未產生');const d=await r.json();$('meta').textContent=`行情日期 ${d.asof||'無'} · 追蹤 ${d.universe} 檔 · 可計算 ${d.data_ready} 檔 · 網站更新 ${new Date(d.generated_at).toLocaleString('zh-TW')}`;const signals=d.signals||[];$('signals').innerHTML=`<h2>每日買賣訊號</h2><p class="muted">收盤後評分，不保證隔日成交。無買進訊號時不強制推薦。</p><div class="grid"><div class="stat">買進觀察<strong>${signals.filter(x=>x.action==='BUY_WATCH').length}</strong></div><div class="stat">賣出警示<strong>${signals.filter(x=>x.action==='EXIT_WATCH').length}</strong></div><div class="stat">等待觀察<strong>${signals.filter(x=>x.action==='HOLD_WATCH').length}</strong></div><div class="stat">資料完整<strong>${d.data_ready}/${d.universe}</strong></div></div>${signals.length?signals.map(card).join(''):'<div class="panel">尚無可計算訊號，請先執行 GitHub Actions 初始化行情。</div>'}`;const p=d.performance||{};$('portfolio').innerHTML=`<h2>模擬績效分析中心</h2><div class="grid"><div class="stat">已實現損益<strong class="${tone(p.realized||0)}">${money(p.realized)}</strong></div><div class="stat">未實現損益<strong class="${tone(p.unrealized||0)}">${money(p.unrealized)}</strong></div><div class="stat">已結案勝率<strong>${p.win_rate==null?'—':p.win_rate+'%'}</strong></div><div class="stat">獲利因子<strong>${p.profit_factor==null?'—':p.profit_factor}</strong></div></div><div class="panel"><h2>模擬交易紀錄</h2><div class="tablewrap"><table><thead><tr><th>股票</th><th>訊號日</th><th>模擬進場</th><th>參考價</th><th>損益</th><th>狀態／賣出原因</th></tr></thead><tbody>${(p.trades||[]).map(t=>`<tr><td>${esc(t.name)} ${esc(t.symbol)}</td><td>${esc(t.signal_date)}</td><td>${esc(t.entry_date)}</td><td>${money(t.entry_price)} → ${money(t.mark_price)}</td><td class="${tone(t.pnl)}">${money(t.pnl)} (${t.return_pct}%)</td><td>${t.exit_date?'已出場：'+esc(t.exit_reason):'未平倉'}</td></tr>`).join('')||'<tr><td colspan="6">尚無模擬交易；訊號出現後，下一交易日才可能建立模擬持倉。</td></tr>'}</tbody></table></div></div>`;$('weekly').innerHTML=`<h2>每週績效回顧</h2><div class="panel"><div class="tablewrap"><table><thead><tr><th>ISO 週次</th><th>已實現損益 (NT$)</th><th>平倉筆數</th><th>獲利筆數</th></tr></thead><tbody>${(p.weekly||[]).map(w=>`<tr><td>${esc(w.week)}</td><td class="${tone(w.realized)}">${money(w.realized)}</td><td>${w.closed}</td><td>${w.wins}</td></tr>`).join('')||'<tr><td colspan="4">目前沒有已結案交易</td></tr>'}</tbody></table></div></div><p class="muted">週報以平倉日歸屬週次；未實現損益在績效中心另外顯示。</p>`;$('method').innerHTML=`<h2>策略與資料規則</h2><div class="panel"><p>策略沿用 V3.3 量價趨勢評分：MA 多頭 30 分、突破前 20 日高點 25 分、量增 20 分、RSI 15 分、60 日區間位置 10 分。分數 ≥65 且沒有賣出警示才列為買進觀察。</p><p>賣出警示：收盤跌破 MA20、MA60、RSI14 &lt;45 或放量下跌。停損參考收盤價－2ATR、目標價＋3ATR。</p><p>資料來源：臺灣證交所 STOCK_DAY 月歷史日行情，僅上市且在 watchlist.json 中的股票。資料每日收盤後由 GitHub Actions 更新，並非盤中即時行情。</p><h3>績效假設與限制</h3><ul>${(d.caveats||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${(d.errors||[]).length?`<details><summary>資料來源警告 (${d.errors.length})</summary><ul>${d.errors.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}</div>`;}catch(e){$('meta').textContent='尚未完成第一次資料更新';$('signals').innerHTML=`<div class="panel">${esc(e.message)}。請至 GitHub → Actions 手動執行 Daily Taiwan Stock Signals。</div>`;}}
boot();
</script></body></html>
