name: Daily Taiwan Stock Signals

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 17:30
    # GitHub Actions 使用 UTC
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tw-quant-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock strategy
        run: python scripts/update.py

      - name: Save updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily stock signals"
            git push
          fi
