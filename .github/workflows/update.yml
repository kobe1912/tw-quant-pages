name: Daily Taiwan Stock Signals
on:
  workflow_dispatch:
    inputs:
      connection_only:
        description: '先只測永豐登入＋台積電短區間行情（不發布）'
        type: boolean
        default: false
      max_requests:
        description: '每次歷史查詢上限（1至200；預設80）'
        type: string
        default: '80'
  schedule:
    - cron: '30 9 * * 1-5'
  push:
    branches: [main]
    paths: ['scripts/**','tests/**','docs/index.html','docs/app.js','docs/strategy-spec.md','watchlist.json','sector_memberships.json','strategy_config.json','requirements.txt','.github/workflows/update.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tw-quant-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strategy and data adapter
        run: python -m unittest discover -s tests -v
      - name: Install Shioaji
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read SinoPac market data only
        env:
          SINOPAC_API_KEY: ${{ secrets.SINOPAC_API_KEY }}
          SINOPAC_SECRET_KEY: ${{ secrets.SINOPAC_SECRET_KEY }}
          SINOPAC_SIMULATION: 'true'
          CONNECTION_ONLY: ${{ inputs.connection_only }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          if [ "$CONNECTION_ONLY" = "true" ]; then
            python scripts/update.py --check-connection
          else
            python scripts/update.py --max-requests "${MAX_REQUESTS:-80}"
          fi
      - name: Validate frontend
        if: ${{ inputs.connection_only != true }}
        run: |
          node --check docs/app.js
          node tests/test_ui.cjs
      - name: Save generated data without force push
        if: ${{ inputs.connection_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          for f in docs/data/sinopac_history.json docs/data/sinopac_sync.json docs/data/sinopac_signals.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SinoPac sector research data"
          for attempt in 1 2 3; do
            git fetch origin main
            changed=$(git diff --name-only HEAD...origin/main -- scripts tests docs/index.html docs/app.js watchlist.json sector_memberships.json strategy_config.json requirements.txt .github/workflows/update.yml)
            if [ -n "$changed" ]; then
              echo "::error::Source changed during update. Start a new Run workflow on main."
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Concurrent data changes require a new run; no remote files were overwritten."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Remote kept changing; start a new run after editing is complete."
          exit 1
      - uses: actions/configure-pages@v5
        if: ${{ inputs.connection_only != true }}
      - uses: actions/upload-pages-artifact@v4
        if: ${{ inputs.connection_only != true }}
        with:
          path: docs
  deploy:
    if: ${{ inputs.connection_only != true }}
    needs: update
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
